<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Play is temporarily paused · Rarescraper</title>
  <style>
    @media (prefers-color-scheme: dark) { :root { color-scheme: light; } }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem;
      background: #69b6e8; color: #1b3a5c; font-family: system-ui, sans-serif; }
    main { width: min(100%, 25rem); padding: 1.5rem; background: #fcf9f0;
      border: 3px solid #1b3a5c; box-shadow: 5px 5px #1b3a5c; }
    h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; }
    p { margin: .8rem 0 1.25rem; }
    a { display: inline-block; padding: .6rem .9rem; color: inherit; background: #ffcf3f;
      border: 2px solid #1b3a5c; font-weight: 700; }
    a:focus-visible { outline: 3px solid #1b3a5c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Play is temporarily paused</h1>
    <p>We’re getting the next tower ready. Your saved results are still on this device.</p>
    <a href="/">Check again</a>
  </main>
</body>
</html>
